name: Module 6C - Service Containers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  redis-job:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Redis Service
        run: echo "Redis service container running on port 6379"
