name: Manual Workflow

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Your name'
        required: true
        default: 'Hamzah'
      greeting:
        description: 'Greeting message'
        required: true
        default: 'Hello'
      data:
        description: 'Extra data'
        required: false
        default: 'sample data'

jobs:
  manual-job:
    runs-on: ubuntu-latest
    steps:
      - name: Print inputs
        run: echo "${{ inputs.greeting }} ${{ inputs.name }}, data is ${{ inputs.data }}"
